# Self-hosted Gen1Recomp SaveSync.
#
#   docker compose up -d
#   docker compose logs savesync     # <- your setup code is printed here
#
# Paste that code into the game: SaveSync -> Set Up -> Use a setup code.
# Do the same on every other device and they all share one set of saves.

services:
  savesync:
    build: .
    # or, once you have pushed it somewhere:
    # image: ghcr.io/you/gen1recomp-savesync:1.0.0
    container_name: gen1recomp-savesync
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # The address the GAME will use. On a LAN, your machine's IP; behind a
      # reverse proxy or tunnel, the public https URL. It is baked into the
      # setup code, so get it right before you copy the code out.
      PUBLIC_URL: "http://192.168.1.10:8787"
      SERVER_NAME: "My save server"
      # Leave unset to have a token minted on first boot and written to
      # /data/tokens.json. Set it to manage tokens yourself; comma-separated,
      # one per household member who should have their OWN separate storage.
      # SAVESYNC_TOKENS: "pick-something-long-and-random"
    volumes:
      - saves:/data

volumes:
  saves:
